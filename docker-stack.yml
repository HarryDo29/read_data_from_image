services:
  bet-image-reader:
    # Build this local tag on the VPS before deploying the stack.
    image: bet-image-reader:local

    ports:
      - target: 8501
        published: 8501
        protocol: tcp
        mode: ingress

    volumes:
      # For a single-node Swarm this keeps the SQLite database in ./data.
      # For multiple nodes, use a shared volume (NFS/云 storage) instead.
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /app/data

    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

