services:
  bet-image-reader:
    # Build this image on the VPS first:
    # docker build -t bet-image-reader:local .
    image: bet-image-reader:local
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8501}:8501"
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
